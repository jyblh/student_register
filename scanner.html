<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業說明會｜工作人員手機簽到</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--a:#a9522d;--ink:#302925;--muted:#756a63;--line:#e3d7cf;--ok:#245f44;--warn:#7b5618;--bad:#873535}
*{box-sizing:border-box}body{margin:0;background:#f4f1ed;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
main{width:min(620px,calc(100% - 20px));margin:auto;padding:16px 0 45px}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:0 10px 28px rgba(55,38,27,.08)}
h1{margin:0 0 5px;font-size:1.55rem}.sub{margin:0 0 16px;color:var(--muted);font-size:.9rem}
label{display:block;font-weight:900;font-size:.9rem;margin:12px 0 5px}input,select{width:100%;min-height:47px;border:1px solid #d5c9c0;border-radius:11px;padding:10px;font:inherit;background:#fff}
button{width:100%;min-height:49px;border:0;border-radius:11px;background:var(--a);color:#fff;font:inherit;font-weight:900;margin-top:12px;cursor:pointer}.secondary{background:#504945}.ghost{background:#eee8e4;color:#514944}
#reader{margin-top:14px;border-radius:14px;overflow:hidden}.result{display:none;margin-top:14px;padding:16px;border-radius:12px}.ok{display:block;background:#e5f3eb;color:var(--ok)}.warn{display:block;background:#fff2da;color:var(--warn)}.err{display:block;background:#fae8e8;color:var(--bad)}
.big{font-size:1.3rem;font-weight:900}.meta{margin-top:5px;line-height:1.65}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.tabs button{margin:0}.manual{margin-top:15px;padding-top:15px;border-top:1px dashed var(--line)}
.hint{margin-top:13px;padding:11px;background:#f8f4f0;border-radius:10px;color:#6d625b;font-size:.86rem}
</style>
</head>
<body><main><div class="card">
<h1>工作人員手機簽到</h1><p class="sub">先選目前企業場次，再使用手機鏡頭掃學生個人 QR Code。</p>
<label>工作人員密碼</label><input id="key" type="password">
<label>目前簽到場次</label><select id="session"><option value="">場次載入中…</option></select>
<div class="tabs"><button id="start">開啟相機掃描</button><button id="stop" class="secondary">停止相機</button></div>
<div id="reader"></div><div id="result" class="result"></div>
<div class="manual"><label>QR 掃不到？使用學號手動簽到</label><input id="studentId"><button id="manualBtn" class="ghost">手動簽到</button></div>
<div class="hint">iPhone 建議 Safari；Android 建議 Chrome。工作人員切換企業場次後，請再次確認上方「目前簽到場次」。</div>
</div></main>
<script>
const GAS_URL="https://script.google.com/macros/s/AKfycbyrk9C7Cul4fUIKwFhZd8fJ5xsp-JdmebLICIaAPuNBqNoxmjYLS0lfdhxYoRU8p6zqRw/exec";
const $=id=>document.getElementById(id);let scanner=null,busy=false,lastToken="",lastAt=0;
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
function show(c,d){$("result").className=`result ${c}`;if(typeof d==="string"){$("result").textContent=d;return}$("result").innerHTML=`<div class="big">${esc(d.title)}</div><div class="meta">${esc(d.name||"")} ${d.studentId?"｜"+esc(d.studentId):""}<br>${esc(d.company||"")}<br>${esc(d.date||"")} ${esc(d.time||"")}${d.checkinTime?"<br>簽到："+esc(d.checkinTime):""}</div>`}
async function loadSessions(){
 try{const r=await fetch(`${GAS_URL}?action=sessions&t=${Date.now()}`),d=await r.json();if(!d.ok)throw new Error(d.message);
 $("session").innerHTML='<option value="">請選擇場次</option>'+d.sessions.map(s=>`<option value="${esc(s.id)}">${esc(s.date)} ${esc(s.time)}｜${esc(s.company)}</option>`).join("");
 }catch(e){show("err",e.message)}
}
function base(){const scannerKey=$("key").value.trim(),sessionId=$("session").value;if(!scannerKey){show("err","請輸入工作人員密碼。");return null}if(!sessionId){show("err","請先選擇目前場次。");return null}return{scannerKey,sessionId}}
async function send(payload){if(busy)return;busy=true;try{const r=await fetch(GAS_URL,{method:"POST",body:JSON.stringify(payload)}),d=await r.json();if(!d.ok)throw new Error(d.message||"簽到失敗");show(d.duplicate?"warn":"ok",{title:d.duplicate?"已簽到":"簽到成功",...d});if(navigator.vibrate)navigator.vibrate(120)}catch(e){show("err",e.message);if(navigator.vibrate)navigator.vibrate([150,80,150])}finally{setTimeout(()=>busy=false,700)}}
$("start").onclick=async()=>{const b=base();if(!b)return;try{if(scanner){try{await scanner.stop()}catch(_){}}scanner=new Html5Qrcode("reader");await scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240},aspectRatio:1},decoded=>{const now=Date.now();if(decoded===lastToken&&now-lastAt<2500)return;lastToken=decoded;lastAt=now;send({action:"checkin",...b,token:decoded})},()=>{})}catch(e){show("err","無法開啟相機："+e)}}
$("stop").onclick=async()=>{if(scanner){try{await scanner.stop();await scanner.clear()}catch(_){}scanner=null}}
$("manualBtn").onclick=()=>{const b=base();if(!b)return;const studentId=$("studentId").value.trim();if(!studentId){show("err","請輸入學號。");return}send({action:"manualCheckin",...b,studentId})}
loadSessions();
</script></body></html>
